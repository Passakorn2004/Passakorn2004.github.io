
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Passakorn | Blue Black Hole AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02030b;
      font-family: Arial, sans-serif;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 12px;
      text-align: center;
      color: white;
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(
        to bottom, rgba(1,4,20,.8), transparent
      );
    }

    .header h1 {
      margin: 0;
      font-size: 23px;
      letter-spacing: 4px;
      color: #55caff;
      text-shadow: 0 0 15px #007bff;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 12px;
      letter-spacing: 3px;
      color: #d8e9ff;
    }

    .status {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 20px;
      color: #dff6ff;
      background: rgba(3, 12, 35, .88);
      border: 1px solid #168bff;
      border-radius: 30px;
      box-shadow: 0 0 20px #005eff55;
      font-size: 13px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #02030b;
      color: #62caff;
      text-align: center;
      transition: opacity .6s;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader .orb {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: radial-gradient(circle, #000 30%, #087dff 55%, #000 72%);
      box-shadow: 0 0 30px #007bff;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(.8) rotate(0deg); }
      to { transform: scale(1.15) rotate(180deg); }
    }

    a-scene {
      position: fixed;
      inset: 0;
    }
  </style>
</head>

<body>

  <div class="loader" id="loader">
    <div>
      <div class="orb"></div>
      <div>INITIALIZING COSMIC AR...</div>
      <p style="font-size:12px;color:#9bb9dc">
        อนุญาตให้เข้าถึงกล้องเพื่อเริ่มใช้งาน
      </p>
    </div>
  </div>

  <div class="header">
    <h1>PASSAKORN</h1>
    <p>BLUE BLACK HOLE · AR EXPERIENCE</p>
  </div>

  <div class="status" id="status">
    กำลังเตรียมระบบ AR...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true; logarithmicDepthBuffer: true"
    loading-screen="enabled: false"
    arjs="trackingMethod: best; sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;"
  >

    <a-assets timeout="30000">
      <a-asset-item
        id="blackHoleModel"
        src="https://sibsansuk.github.io/epona.glb">
      </a-asset-item>
    </a-assets>

    <!--
      NFT image tracking:
      ต้องใช้ชุดไฟล์ descriptor .fset, .fset3, .iset
      ที่สร้างจาก tracker.png ก่อน
    -->
    <a-nft
      id="targetMarker"
      type="nft"
      url="https://aitutorialcourse.github.io/tracker"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      emitevents="true"
      size="100"
      >

      <!-- โมเดล GLB -->
      <a-entity
        id="model"
        gltf-model="#blackHoleModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="10 10 10"
        animation-mixer="clip: *; loop: repeat"
      >
      </a-entity>

      <!-- วงแหวนพลังงานสีน้ำเงิน -->
      <a-entity id="energyEffects" position="0 0 0">

        <a-torus
          position="0 0.1 0"
          rotation="90 0 0"
          radius="1.15"
          radius-tubular="0.018"
          material="color: #0088ff; emissive: #0066ff; emissiveIntensity: 2; transparent: true; opacity: 0.9"
          animation="property: rotation; to: 90 360 0; dur: 5000; easing: linear; loop: true">
        </a-torus>

        <a-torus
          position="0 0.15 0"
          rotation="90 25 0"
          radius="1.35"
          radius-tubular="0.012"
          material="color: #53dfff; emissive: #008cff; emissiveIntensity: 2; transparent: true; opacity: 0.7"
          animation="property: rotation; to: 90 -335 0; dur: 7500; easing: linear; loop: true">
        </a-torus>

        <a-sphere
          position="0 0.12 0"
          radius="0.32"
          material="shader: standard; color: #000000; emissive: #001a55; emissiveIntensity: 0.8; metalness: 0.9; roughness: 0.15"
          animation="property: scale; to: 1.12 1.12 1.12; dur: 1800; dir: alternate; easing: easeInOutSine; loop: true">
        </a-sphere>

        <!-- แสงพลังงาน -->
        <a-light
          type="point"
          color="#087dff"
          intensity="1.8"
          distance="5"
          position="0 1 0">
        </a-light>

      </a-entity>

      <!-- ชื่อเจ้าของผลงาน -->
      <a-entity
        position="0 2.0 0"
        text="value: PASSAKORN; align: center; anchor: center; width: 5; color: #70dfff; shader: msdf"
        animation="property: position; to: 0 2.15 0; dur: 1800; dir: alternate; easing: easeInOutSine; loop: true">
      </a-entity>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const loader = document.getElementById('loader');
    const status = document.getElementById('status');
    const marker = document.getElementById('targetMarker');
    const model = document.getElementById('model');

    function hideLoader() {
      loader.classList.add('hidden');
    }

    // ซ่อนหน้าโหลดเมื่อระบบ AR พร้อม
    document.querySelector('a-scene').addEventListener(
      'loaded',
      () => {
        setTimeout(hideLoader, 1500);
        status.textContent = 'ส่องกล้องไปที่ Marker เพื่อแสดงโมเดล 3D';
      }
    );

    // เมื่อพบ Marker
    marker.addEventListener('markerFound', () => {
      status.textContent = '✦ BLACK HOLE ACTIVATED · PASSAKORN ✦';
    });

    // เมื่อไม่พบ Marker
    marker.addEventListener('markerLost', () => {
      status.textContent = 'ส่องกล้องไปที่ Marker เพื่อแสดงโมเดล 3D';
    });

    // แจ้งกรณีโมเดลโหลดไม่สำเร็จ
    model.addEventListener('model-error', () => {
      status.textContent = 'โหลดโมเดลไม่สำเร็จ กรุณาตรวจสอบ URL';
    });

    model.addEventListener('model-loaded', () => {
      console.log('3D model loaded successfully');
    });

    // รองรับกรณีเริ่มกล้องไม่ได้
    window.addEventListener('error', (event) => {
      console.error('AR error:', event.message);
    });
  </script>

</body>
</html>
