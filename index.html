
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AR - Blue Black Hole | Passakorn</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js: Image Tracking (NFT) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <!-- Animation support for GLB -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #050711;
      color: white;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050711;
      text-align: center;
      padding: 24px;
      transition: opacity .5s ease;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-content {
      max-width: 320px;
    }

    .loader h2 {
      color: #69d9ff;
      letter-spacing: 3px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 20px auto;
      border: 3px solid #24334f;
      border-top-color: #52dfff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hud {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: 16px;
      z-index: 5;
      pointer-events: none;
    }

    .brand {
      font-size: 11px;
      letter-spacing: 4px;
      color: #75ddff;
      text-transform: uppercase;
    }

    .hud h1 {
      font-size: clamp(20px, 5vw, 30px);
      margin: 7px 0;
      text-shadow: 0 0 18px #147bff;
    }

    .status {
      font-size: 12px;
      color: #c1d7f8;
    }

    .about {
      position: fixed;
      left: 14px;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 5;
      width: min(280px, calc(100% - 28px));
      padding: 15px 17px;
      border: 1px solid rgba(96, 203, 255, .55);
      border-radius: 15px;
      background: rgba(5, 12, 32, .82);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(25, 126, 255, .16);
      pointer-events: none;
    }

    .about h2 {
      margin: 0 0 10px;
      color: #69d9ff;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .about p {
      margin: 6px 0;
      font-size: 13px;
      color: #e3edff;
    }

    .about strong {
      color: #78caff;
      display: inline-block;
      width: 82px;
    }

    .hint {
      position: fixed;
      right: 12px;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 5;
      max-width: 145px;
      text-align: right;
      font-size: 11px;
      color: #b8cbe8;
      pointer-events: none;
    }

    a-scene {
      position: fixed;
      inset: 0;
    }
  </style>
</head>

<body>

  <div class="loader" id="loader">
    <div class="loader-content">
      <div class="spinner"></div>
      <h2>BLUE BLACK HOLE</h2>
      <p id="loadMessage">กำลังเตรียมระบบ AR...</p>
      <p style="font-size:12px;color:#9eb3d4">
        อนุญาตให้เว็บไซต์ใช้กล้อง แล้วส่องไปที่ Marker
      </p>
    </div>
  </div>

  <header class="hud">
    <div class="brand">Augmented Reality</div>
    <h1>Blue Black Hole</h1>
    <div class="status" id="trackingStatus">
      ◉ รอการตรวจจับ Marker
    </div>
  </header>

  <section class="about">
    <h2>ABOUT ME</h2>
    <p><strong>Name:</strong> Passakorn</p>
    <p><strong>Age:</strong> 22</p>
    <p><strong>Birthday:</strong> 06/08/2004</p>
  </section>

  <div class="hint">
    POINT CAMERA AT MARKER<br>
    <span style="color:#69d9ff">SCAN TO EXPLORE</span>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets timeout="60000">
      <a-asset-item
        id="blackHoleModel"
        src="https://sibsansuk.github.io/epona.glb">
      </a-asset-item>
    </a-assets>

    <!--
      IMPORTANT:
      สร้าง NFT descriptors จาก tracker.png ก่อน
      และอัปโหลดไฟล์ tracker.fset, tracker.fset3,
      tracker.iset ไปยังโฟลเดอร์ /markers/

      URL ต้องเป็น path ก่อนนามสกุลไฟล์
    -->
    <a-nft
      id="imageMarker"
      type="nft"
      url="https://YOUR-DOMAIN.github.io/markers/tracker"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- 3D Model with embedded GLB animations -->
      <a-entity
        id="model"
        gltf-model="#blackHoleModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="5 5 5"
        animation-mixer="loop: repeat"
      >
      </a-entity>

    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loader = document.getElementById("loader");
    const loadMessage = document.getElementById("loadMessage");
    const trackingStatus = document.getElementById("trackingStatus");
    const marker = document.getElementById("imageMarker");
    const model = document.getElementById("model");

    let modelLoaded = false;
    let markerVisible = false;

    function hideLoader() {
      loader.classList.add("hidden");
    }

    // ตรวจสอบว่าโมเดลโหลดสำเร็จหรือไม่
    model.addEventListener("model-loaded", () => {
      modelLoaded = true;
      loadMessage.textContent = "โหลดโมเดล 3D สำเร็จ";

      if (markerVisible) {
        hideLoader();
      }
    });

    model.addEventListener("model-error", (event) => {
      loadMessage.textContent =
        "โหลดโมเดลไม่สำเร็จ กรุณาตรวจสอบ URL และ CORS";
      console.error("GLB model error:", event.detail);
    });

    // เมื่อพบภาพ Marker
    marker.addEventListener("markerFound", () => {
      markerVisible = true;
      trackingStatus.textContent = "◉ ตรวจพบ Marker แล้ว";

      if (modelLoaded) {
        hideLoader();
      }
    });

    // เมื่อภาพ Marker หลุดจากกล้อง
    marker.addEventListener("markerLost", () => {
      markerVisible = false;
      trackingStatus.textContent = "◉ รอการตรวจจับ Marker";
    });

    // รอให้ AR.js โหลด Image Descriptors
    window.addEventListener("arjs-nft-loaded", () => {
      loadMessage.textContent =
        "พร้อมแล้ว กรุณาส่องกล้องไปที่ Marker";
    });

    // แสดงข้อความผิดพลาดหากโหลด NFT descriptors ไม่สำเร็จ
    window.addEventListener("error", (event) => {
      console.error("AR error:", event.message);
    });

    // ซ่อนหน้าจอโหลดเมื่อโมเดลพร้อมและ Marker ถูกตรวจพบ
    // หากยังไม่พบ Marker ให้หน้าจอโหลดค้างไว้เพื่อแจ้งสถานะ
    setTimeout(() => {
      if (!modelLoaded) {
        loadMessage.textContent =
          "กำลังโหลดโมเดล กรุณารอสักครู่...";
      }
    }, 8000);
  </script>

</body>
</html>
